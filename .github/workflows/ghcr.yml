name: 容器镜像（ghcr.io）

# 发布通道之二：把 WOS 打成容器镜像推到 GitHub Packages（ghcr.io）。
# 手工触发（选一个已发布的标签）：Actions → 本工作流 → Run workflow
# 自动触发：push 任何 v* 标签时。
#
# 二进制来自「标签提交」（与 Release 资产同源、同工具链、同标志），
# Dockerfile 与工作流本身来自 main（这样旧标签——它们在打标签时还没有 Dockerfile——也能出镜像）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的发布标签（例如 v1.3.0）'
        required: true
        default: 'v1.3.0'
  push:
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 解析标签
        id: rel
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "构建 $TAG 的镜像"

      - name: 取工具链文件（main：Dockerfile / 工作流）
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: 取发布源码（标签提交）
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}
          path: src
          fetch-depth: 0

      - name: 装 Go（与 Release 相同的工具链）
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: 编译静态二进制（与 Release 相同的标志）
        run: |
          set -euo pipefail
          cd src
          export CGO_ENABLED=0 GOEXPERIMENT=nodwarf5 GOFLAGS=
          go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/wos" ./cmd/wos
          ls -l "$GITHUB_WORKSPACE/dist/wos"
          sha256sum "$GITHUB_WORKSPACE/dist/wos"
          go version -m "$GITHUB_WORKSPACE/dist/wos" | head -3

      - name: 与已发布的二进制比对（同一提交应当逐位相同）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.rel.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern wos-linux-amd64 --dir /tmp/rel || true
          if [ -f /tmp/rel/wos-linux-amd64 ]; then
            echo "Release 资产 : $(sha256sum /tmp/rel/wos-linux-amd64 | cut -d' ' -f1)"
            echo "本次 CI 构建 : $(sha256sum "$GITHUB_WORKSPACE/dist/wos" | cut -d' ' -f1)"
            if cmp -s /tmp/rel/wos-linux-amd64 "$GITHUB_WORKSPACE/dist/wos"; then
              echo "=> 逐位一致"
            else
              echo "=> 有差异（镜像仍可用，但并非字节相同的二进制）"
            fi
          else
            echo "该标签尚无 Release 资产（标签先于发布创建时正常），跳过比对"
          fi

      - name: 组装构建上下文（dist/wos + elements/）
        run: |
          set -euo pipefail
          mkdir -p ctx/dist
          cp "$GITHUB_WORKSPACE/dist/wos" ctx/dist/wos
          cp -r src/elements ctx/elements
          find ctx -type f | sort

      - name: 构建并推送镜像
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/tetsuhiro-wos"
          TAG="${{ steps.rel.outputs.tag }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f repo/docker/Dockerfile \
            --build-arg VERSION="$TAG" \
            --build-arg REVISION="$(git -C src rev-parse HEAD)" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" ctx
          docker image inspect "$IMAGE:$TAG" --format 'image id: {{.Id}}  size: {{.Size}} bytes'
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          docker image inspect "$IMAGE:$TAG" --format 'digest: {{index .RepoDigests 0}}'
